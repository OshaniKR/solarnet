global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # The API instruments itself directly (request counts, plus the alert-relevant
  # gauges solarnet_last_reading_age_seconds and solarnet_zone_solar_share_pct).
  - job_name: solarnet-api
    static_configs:
      - targets: ["api:8000"]

  # The simulators, Spark job and Airflow DAG are not long-lived HTTP servers, so
  # they push their metrics to the Pushgateway instead of being scraped directly.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
